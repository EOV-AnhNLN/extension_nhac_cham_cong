<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Nhắc Nhở Chấm Công</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .notification {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 16px 20px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 32px;
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0);
            }

            25% {
                transform: rotate(-10deg);
            }

            75% {
                transform: rotate(10deg);
            }
        }

        .content {
            flex: 1;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .message {
            font-size: 13px;
            opacity: 0.9;
        }

        .time {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Consolas', monospace;
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="notification">
        <div class="header">
            <span class="icon" id="icon">⏰</span>
            <div class="content">
                <div class="title">Nhắc Nhở Chấm Công</div>
                <div class="message" id="message">Đừng quên chấm công!</div>
            </div>
        </div>
        <div class="time" id="current-time"></div>
        <div class="buttons">
            <button class="btn-primary" id="open-fastwork">🌐 Mở FastWork</button>
            <button class="btn-secondary" id="dismiss">✓ OK</button>
        </div>
        <div class="buttons" id="extra-buttons">
            <button class="btn-secondary" id="snooze">⏰ 10 phút nữa</button>
            <button class="btn-secondary" id="skip">🚫 Bỏ qua hôm nay</button>
        </div>
    </div>

    <script src="reminder.js"></script>
</body>

</html>
